# Кинозал: приложение внутри Discord (Activity). Бесплатно работает на Cloudflare Workers.
# Развернуть: npx wrangler deploy   (подробно — cinema/README.md)
name = "kinozal"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# ИИ для бота: картинки (обложки) — бесплатный Workers AI
[ai]
binding = "AI"

[vars]
# ID приложения бота (Developer Portal → General Information → Application ID)
CLIENT_ID = ""
# модели Gemini для текста — по очереди, если первая занята; ключ — секрет: npx wrangler secret put GEMINI_API_KEY
GEMINI_MODEL = "gemini-3-flash-preview,gemini-flash-latest,gemini-flash-lite-latest"
